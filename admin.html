<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Paneli</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#172033}header{background:#132d50;color:#fff;padding:22px 5%;font-size:23px;font-weight:900}.wrap{max-width:1300px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #e2e7ee;border-radius:16px;box-shadow:0 10px 30px #1231;padding:22px}.login{max-width:480px;margin:90px auto}input,select,button{padding:12px;border:1px solid #d8dee8;border-radius:9px;font:inherit}input{width:100%;margin:10px 0}button{background:#246be8;color:#fff;border:0;font-weight:800;cursor:pointer}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.stats{font-weight:800}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}.pill{padding:5px 8px;border-radius:20px;background:#eef3ff}.danger{background:#b91c1c;padding:8px}.muted{color:#778}.hidden{display:none}.err{color:#b91c1c;margin-top:8px}</style></head><body><header>Mutfak+ — Yönetim Paneli</header><div class="wrap"><section id="login" class="card login"><h1>Yetkili Girişi</h1><p class="muted">Sipariş taleplerini görüntülemek için yönetici şifrenizi girin.</p><input id="pw" type="password" placeholder="Admin şifresi"><button onclick="load()">Giriş Yap</button><div id="err" class="err"></div></section><section id="panel" class="card hidden"><div class="toolbar"><div><h2 style="margin:0">Sipariş Talepleri</h2><span id="stats" class="stats muted"></span></div><button onclick="load()">Yenile</button></div><div class="tablewrap"><table><thead><tr><th>ID / Tarih</th><th>Müşteri</th><th>Ürün</th><th>Adres</th><th>Talep Bilgisi</th><th>Durum</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script>let token=sessionStorage.adminToken||'';async function api(method='GET',body,url='/api/admin-orders'){const r=await fetch(url,{method,headers:{'content-type':'application/json','authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Hata');return r.json()}async function load(){if(pw&&pw.value){token=pw.value;sessionStorage.adminToken=token}try{const d=await api();login.classList.add('hidden');panel.classList.remove('hidden');stats.textContent=d.orders.length+' kayıt';rows.innerHTML=d.orders.map(o=>`<tr><td><b>#${o.id}</b><br><span class="muted">${new Date(o.created_at).toLocaleString('tr-TR')}</span></td><td><b>${esc(o.first_name)} ${esc(o.last_name)}</b><br>${esc(o.phone)}</td><td>${esc(o.product)}<br>Adet: ${o.qty||1}</td><td>${esc(o.city)} / ${esc(o.district)}<br>${esc(o.address)}</td><td>${esc(o.request_no)}<br>${esc(o.request_date)} • ${esc(o.request_code)}</td><td><select onchange="status(${o.id},this.value)">${['Yeni','Onaylandı','Kargolandı','İptal'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="danger" onclick="del(${o.id})">Sil</button></td></tr>`).join('')}catch(e){err.textContent='Giriş başarısız veya sunucu bağlantısı kurulamadı.'}}async function status(id,status){await api('PATCH',{id,status})}async function del(id){if(!confirm('Bu kaydı silmek istediğinize emin misiniz?'))return;await api('DELETE',null,'/api/admin-orders?id='+id);load()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)load();</script></body></html>
